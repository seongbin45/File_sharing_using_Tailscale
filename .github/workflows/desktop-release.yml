name: desktop-release

# Build the TsBackup desktop app and package it as a Windows installer
# (TsBackup-Setup.exe, via Inno Setup - see build/tsbackup.iss), then
# attach that installer to a GitHub Release. PyInstaller output is
# OS-specific, so this MUST run on a Windows runner - a Linux build would
# produce an ELF, not the .exe the installer needs to wrap. Inno Setup
# 6.7.1 ships preinstalled on windows-latest (Windows Server 2025 image;
# NSIS does not, as of that image - confirmed against actions/runner-images'
# published manifest), so no extra installer-tool setup step is needed.
#
# Trigger: push a version tag.
#     git tag v0.1.0
#     git push origin v0.1.0
#
# You can also run it by hand from the Actions tab (workflow_dispatch) to
# get an artifact without cutting a release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write        # needed to create/attach the release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop     # spec expects to run from desktop/
    env:
      # windows-latest's stdout here is a pipe captured by the pwsh runner,
      # not a real console, so Python falls back to the legacy codepage
      # (cp1252) for it - the same failure a real Korean-locale Windows PC
      # hits in its default console. Belt-and-suspenders with the in-code
      # sys.stdout.reconfigure() calls: PYTHONUTF8 is PEP 540's broader
      # UTF-8 mode (filesystem encoding, locale.getpreferredencoding());
      # PYTHONIOENCODING pins stdin/stdout/stderr encoding directly.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test the pure core
        # Fast, no Qt/network. If the logic is broken, fail before building.
        run: python -m tests.selftest

      - name: Update manager unit tests
        # Also fast, no Qt, no live network (every GitHub/download call is
        # mocked) - covers update_manager/'s version compare, asset
        # selection, resumable/digest-verified download, and run_once()'s
        # state machine against a fake install dir.
        run: python -m tests.test_update_manager

      - name: GUI smoke test
        # Actually constructs MainWindow (both roles), SettingsDialog, Tray,
        # and SetupWizard and exercises their wiring (role-switch rebuild,
        # the settings dialog's advanced-section disclosure, the tray's
        # failure-notification icon state, the wizard's unreachable-code
        # error path) - not just that they import, which is all the later
        # --check-gui step on the frozen binary proves. Runs against the
        # source tree with the same Python env "Install dependencies" set
        # up, before spending time on the PyInstaller build below, so a GUI
        # regression fails fast rather than after a multi-minute build.
        run: python -m tests.gui_smoke

      - name: Build TsBackup.exe
        run: pyinstaller build/tsbackup.spec

      - name: Smoke-test the binary
        # --config proves the onefile bundle imports (py7zr codecs,
        # transports) without needing a display. --check-gui separately
        # proves the actual GUI launch path's imports resolve - --config
        # alone missed a real bug (a relative import that only breaks
        # once frozen, since PyInstaller's bootloader runs this entry
        # script as bare __main__, unlike `python -m app.main` in dev)
        # because it returns before _gui() is ever reached.
        run: |
          .\dist\TsBackup.exe --config
          .\dist\TsBackup.exe --check-gui

      - name: Build TsBackup_update_manager.exe
        # A fully independent background exe - see update_manager/'s own
        # docs. tsbackup.iss's [Files] section expects this at dist\ next
        # to TsBackup.exe.
        run: pyinstaller build/update_manager.spec

      - name: Smoke-test the update manager binary
        # --once against a scratch install dir with no real TsBackup.exe
        # in it: proves the frozen bundle's imports resolve (ctypes/winreg/
        # urllib) and that run_once() reaches and correctly reports
        # "no_version" for a directory with no VERSION/exe to read -
        # without needing a real release or a real installed app.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\um_smoke" | Out-Null
          $env:TSBACKUP_INSTALL_DIR = "$env:RUNNER_TEMP\um_smoke"
          .\dist\TsBackup_update_manager.exe --once

      - name: Determine version
        # From the vX.Y.Z tag when this run was triggered by one; 99.0.0 for
        # a workflow_dispatch run with no tag context (e.g. validating the
        # pipeline before cutting a release). 99.0.0, not 0.0.0: the later
        # "Install and smoke-test the installer" steps run the *real*
        # update manager against this real installed VERSION and make a
        # genuine network call to the real GitHub Releases API - once a
        # real vX.Y.Z release exists with a matching TsBackup.exe asset
        # (true from v0.3.0 onward), an 0.0.0 dev build looks older than
        # it and the smoke test would perform a real live self-update
        # (download + kill + replace + relaunch a persistent tray
        # process) instead of just proving the binary runs. 99.0.0 keeps
        # it always newer than any real release, so run_once() reports
        # up_to_date and the smoke test stays a smoke test.
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ($raw -match '^v(\d+\.\d+\.\d+)$') { $v = $matches[1] } else { $v = "99.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Write VERSION
        # Plain-text sidecar the update manager reads to know what's
        # currently installed (update_manager/versioning.py's
        # read_installed_version() prefers this over the PE FileVersion /
        # ARP DisplayVersion fallbacks) - same version string iscc gets
        # below, so both agree.
        shell: pwsh
        run: Set-Content -Path dist\VERSION -Value "${{ steps.ver.outputs.version }}" -NoNewline -Encoding ascii

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version }} build\tsbackup.iss

      - name: Install and smoke-test the installer (per-machine / admin)
        # This is the installer's new *default* mode (PrivilegesRequired
        # is now "admin" - tsbackup.iss), and the one that was actually
        # broken on real hardware: the update manager runs unelevated
        # (login-triggered) but {app} lands in Program Files, where
        # Windows ACLs deny an unelevated write unless tsbackup.iss's
        # [Dirs] "users-modify" grant is actually in effect. This pass is
        # what would have caught that - it never ran before this fix.
        shell: pwsh
        run: |
          Start-Process -FilePath ".\dist\TsBackup-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/ALLUSERS" -Wait
          $installDir = "${env:ProgramFiles(x86)}\TsBackup"
          if (!(Test-Path $installDir)) { $installDir = "$env:ProgramFiles\TsBackup" }
          $installed = "$installDir\TsBackup.exe"
          if (!(Test-Path $installed)) { throw "installed exe not found at $installed" }
          & $installed --config
          & $installed --check-gui
          foreach ($name in @("TsBackup_update_manager.exe","TsBackup_update_manager.bat","TsBackup_update_manager_hidden.vbs","VERSION")) {
            if (!(Test-Path "$installDir\$name")) { throw "missing installed file: $installDir\$name" }
          }
          $env:TSBACKUP_INSTALL_DIR = $installDir
          # The actual regression check: this write (status_root's mkdir,
          # by way of run_once()) previously failed with WinError 5 here.
          # Start-Process -Wait -PassThru, not "&": the previous run saw
          # $LASTEXITCODE come back blank (not 0, not nonzero - unset)
          # after "&" against this console=False exe, with no new log
          # line at all - i.e. the process may never have actually
          # started. -PassThru gives a real process object with a real
          # ExitCode, a clearer failure if CreateProcess itself is
          # refused (AV/SmartScreen on a just-installed Program Files
          # exe is the leading suspect), and Wait-Process as a backstop
          # against Start-Process -Wait itself returning early.
          $proc = Start-Process -FilePath "$installDir\TsBackup_update_manager.exe" -ArgumentList "--once" -PassThru
          Wait-Process -Id $proc.Id -Timeout 60 -ErrorAction SilentlyContinue
          $code = $proc.ExitCode
          Write-Host "update manager --once exit code: $code"
          Write-Host "exe still present after run: $(Test-Path "$installDir\TsBackup_update_manager.exe")"
          # console=False means a crash here is otherwise silent - dump
          # its own log so a future failure doesn't need re-diagnosing
          # from scratch (the log path is %LOCALAPPDATA%\TsBackup\, not
          # $installDir). This file is shared across every step in this
          # job (log_dir() ignores install_dir), so only the last few
          # lines are this invocation's.
          $umLog = "$env:LOCALAPPDATA\TsBackup\update_manager.log"
          if (Test-Path $umLog) { Write-Host "--- update_manager.log (tail) ---"; Get-Content $umLog -Tail 10 }
          try {
            $threats = Get-MpThreatDetection -ErrorAction Stop
            if ($threats) { Write-Host "--- Defender detections ---"; $threats | Format-List | Out-String | Write-Host }
          } catch { Write-Host "Get-MpThreatDetection unavailable: $_" }
          if ($code -ne 0) { throw "update manager --once failed against admin install (exit $code)" }

      - name: Install and smoke-test the installer (per-user override)
        # /CURRENTUSER is still a supported opt-out of the new admin
        # default (PrivilegesRequiredOverridesAllowed keeps allowing it) -
        # keep this regression-tested too, into a separate install dir
        # from the admin pass above.
        shell: pwsh
        run: |
          Start-Process -FilePath ".\dist\TsBackup-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait
          $installDir = "$env:LOCALAPPDATA\Programs\TsBackup"
          $installed = "$installDir\TsBackup.exe"
          if (!(Test-Path $installed)) { throw "installed exe not found at $installed" }
          & $installed --config
          & $installed --check-gui
          # The update manager's own files, per tsbackup.iss's [Files] -
          # confirms they actually land in the real install dir, not just
          # that iscc compiled without complaint.
          foreach ($name in @("TsBackup_update_manager.exe","TsBackup_update_manager.bat","TsBackup_update_manager_hidden.vbs","VERSION")) {
            if (!(Test-Path "$installDir\$name")) { throw "missing installed file: $installDir\$name" }
          }
          $env:TSBACKUP_INSTALL_DIR = $installDir
          $proc = Start-Process -FilePath "$installDir\TsBackup_update_manager.exe" -ArgumentList "--once" -PassThru
          Wait-Process -Id $proc.Id -Timeout 60 -ErrorAction SilentlyContinue
          $code = $proc.ExitCode
          Write-Host "update manager --once exit code: $code"
          Write-Host "exe still present after run: $(Test-Path "$installDir\TsBackup_update_manager.exe")"
          $umLog = "$env:LOCALAPPDATA\TsBackup\update_manager.log"
          if (Test-Path $umLog) { Write-Host "--- update_manager.log (tail) ---"; Get-Content $umLog -Tail 10 }
          try {
            $threats = Get-MpThreatDetection -ErrorAction Stop
            if ($threats) { Write-Host "--- Defender detections ---"; $threats | Format-List | Out-String | Write-Host }
          } catch { Write-Host "Get-MpThreatDetection unavailable: $_" }
          if ($code -ne 0) { throw "update manager --once failed against per-user install (exit $code)" }

      # Always keep the installer as a build artifact, even for
      # workflow_dispatch runs that are not tied to a tag.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsBackup-Setup
          path: desktop/dist/TsBackup-Setup.exe
          if-no-files-found: error

      # Only on a version tag: publish/attach to the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/TsBackup-Setup.exe
            desktop/dist/TsBackup.exe
          fail_on_unmatched_files: true

      - name: Remove stale release assets
        # softprops/action-gh-release only uploads what it's told to - it
        # doesn't remove assets a PREVIOUS run on this same tag published
        # under a different name (this is exactly how v0.1.0 ended up with
        # both the old portable TsBackup.exe and the new TsBackup-Setup.exe
        # sitting side by side after this installer change). Keep only the
        # current asset names so a release page never shows a stale/
        # conflicting download. gh CLI + GITHUB_TOKEN are already available
        # on the runner - no extra setup needed.
        #
        # TsBackup.exe is kept deliberately alongside TsBackup-Setup.exe now
        # (not stale) - update_manager/'s auto-updater downloads this raw
        # exe directly, never the installer (running Setup.exe unattended
        # would pop the Inno wizard).
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $keep = @("TsBackup-Setup.exe", "TsBackup.exe")
          $names = gh release view $tag --repo $repo --json assets --jq ".assets[].name"
          foreach ($name in ($names -split "`n")) {
            $name = $name.Trim()
            if ($name -and ($keep -notcontains $name)) {
              Write-Host "Removing stale release asset: $name"
              gh release delete-asset $tag $name --repo $repo --yes
            }
          }
