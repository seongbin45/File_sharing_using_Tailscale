name: desktop-release

# Build the TsBackup desktop app into a Windows .exe and attach it to a
# GitHub Release. PyInstaller output is OS-specific, so this MUST run on a
# Windows runner - a Linux build would produce an ELF, not the .exe the
# release needs.
#
# Trigger: push a version tag.
#     git tag v0.1.0
#     git push origin v0.1.0
#
# You can also run it by hand from the Actions tab (workflow_dispatch) to
# get an artifact without cutting a release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write        # needed to create/attach the release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop     # spec expects to run from desktop/
    env:
      # windows-latest's stdout here is a pipe captured by the pwsh runner,
      # not a real console, so Python falls back to the legacy codepage
      # (cp1252) for it - the same failure a real Korean-locale Windows PC
      # hits in its default console. Belt-and-suspenders with the in-code
      # sys.stdout.reconfigure() calls: PYTHONUTF8 is PEP 540's broader
      # UTF-8 mode (filesystem encoding, locale.getpreferredencoding());
      # PYTHONIOENCODING pins stdin/stdout/stderr encoding directly.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test the pure core
        # Fast, no Qt/network. If the logic is broken, fail before building.
        run: python -m tests.selftest

      - name: Build TsBackup.exe
        run: pyinstaller build/tsbackup.spec

      - name: Smoke-test the binary
        # --config proves the onefile bundle imports (py7zr codecs,
        # transports) without needing a display. --check-gui separately
        # proves the actual GUI launch path's imports resolve - --config
        # alone missed a real bug (a relative import that only breaks
        # once frozen, since PyInstaller's bootloader runs this entry
        # script as bare __main__, unlike `python -m app.main` in dev)
        # because it returns before _gui() is ever reached.
        run: |
          .\dist\TsBackup.exe --config
          .\dist\TsBackup.exe --check-gui

      # Always keep the .exe as a build artifact, even for workflow_dispatch
      # runs that are not tied to a tag.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsBackup-exe
          path: desktop/dist/TsBackup.exe
          if-no-files-found: error

      # Only on a version tag: publish/attach to the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/TsBackup.exe
          fail_on_unmatched_files: true
