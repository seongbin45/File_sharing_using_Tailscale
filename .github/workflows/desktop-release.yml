name: desktop-release

# Build the TsBackup desktop app and package it as a Windows installer
# (TsBackup-Setup.exe, via Inno Setup - see build/tsbackup.iss), then
# attach that installer to a GitHub Release. PyInstaller output is
# OS-specific, so this MUST run on a Windows runner - a Linux build would
# produce an ELF, not the .exe the installer needs to wrap. Inno Setup
# 6.7.1 ships preinstalled on windows-latest (Windows Server 2025 image;
# NSIS does not, as of that image - confirmed against actions/runner-images'
# published manifest), so no extra installer-tool setup step is needed.
#
# Trigger: push a version tag.
#     git tag v0.1.0
#     git push origin v0.1.0
#
# You can also run it by hand from the Actions tab (workflow_dispatch) to
# get an artifact without cutting a release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write        # needed to create/attach the release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop     # spec expects to run from desktop/
    env:
      # windows-latest's stdout here is a pipe captured by the pwsh runner,
      # not a real console, so Python falls back to the legacy codepage
      # (cp1252) for it - the same failure a real Korean-locale Windows PC
      # hits in its default console. Belt-and-suspenders with the in-code
      # sys.stdout.reconfigure() calls: PYTHONUTF8 is PEP 540's broader
      # UTF-8 mode (filesystem encoding, locale.getpreferredencoding());
      # PYTHONIOENCODING pins stdin/stdout/stderr encoding directly.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test the pure core
        # Fast, no Qt/network. If the logic is broken, fail before building.
        run: python -m tests.selftest

      - name: Build TsBackup.exe
        run: pyinstaller build/tsbackup.spec

      - name: Smoke-test the binary
        # --config proves the onefile bundle imports (py7zr codecs,
        # transports) without needing a display. --check-gui separately
        # proves the actual GUI launch path's imports resolve - --config
        # alone missed a real bug (a relative import that only breaks
        # once frozen, since PyInstaller's bootloader runs this entry
        # script as bare __main__, unlike `python -m app.main` in dev)
        # because it returns before _gui() is ever reached.
        run: |
          .\dist\TsBackup.exe --config
          .\dist\TsBackup.exe --check-gui

      - name: Determine version
        # From the vX.Y.Z tag when this run was triggered by one; 0.0.0 for
        # a workflow_dispatch run with no tag context (e.g. validating the
        # pipeline before cutting a release).
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.ref_name }}"
          if ($raw -match '^v(\d+\.\d+\.\d+)$') { $v = $matches[1] } else { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.ver.outputs.version }} build\tsbackup.iss

      - name: Install and smoke-test the installer
        # Proves the *installed* app actually runs from where the installer
        # puts it, not just that the installer compiled. /CURRENTUSER runs
        # the same per-user path a real user could pick interactively, but
        # silently and without a UAC prompt, so it works unattended here.
        shell: pwsh
        run: |
          Start-Process -FilePath ".\dist\TsBackup-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait
          $installed = "$env:LOCALAPPDATA\Programs\TsBackup\TsBackup.exe"
          if (!(Test-Path $installed)) { throw "installed exe not found at $installed" }
          & $installed --config
          & $installed --check-gui

      # Always keep the installer as a build artifact, even for
      # workflow_dispatch runs that are not tied to a tag.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TsBackup-Setup
          path: desktop/dist/TsBackup-Setup.exe
          if-no-files-found: error

      # Only on a version tag: publish/attach to the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/TsBackup-Setup.exe
          fail_on_unmatched_files: true
